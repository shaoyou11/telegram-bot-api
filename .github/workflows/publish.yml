name: publish

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "官方仓库分支、标签或完整提交 SHA；留空使用官方默认分支"
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: telegram-bot-api-publish
  cancel-in-progress: true

env:
  SOURCE_REPOSITORY: https://github.com/tdlib/telegram-bot-api.git
  IMAGE: ghcr.io/shaoyou11/telegram-bot-api

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve official source revision
        id: upstream
        shell: bash
        env:
          REQUESTED_REF: ${{ inputs.upstream_ref }}
        run: |
          set -euo pipefail
          default_ref=$(git ls-remote --symref "$SOURCE_REPOSITORY" HEAD | awk '/^ref:/ {sub("refs/heads/", "", $2); print $2; exit}')
          requested_ref="${REQUESTED_REF:-$default_ref}"
          sha=$(git ls-remote "$SOURCE_REPOSITORY" "refs/heads/$requested_ref" | awk 'NR == 1 {print $1}')
          if [ -z "$sha" ]; then
            sha=$(git ls-remote "$SOURCE_REPOSITORY" "$requested_ref" | awk 'NR == 1 {print $1}')
          fi
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "无法解析官方源码提交：$requested_ref" >&2
            exit 1
          fi
          echo "ref=$requested_ref" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=${sha:0:12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: telegram-bot-api:test
          build-args: |
            TELEGRAM_BOT_API_REF=${{ steps.upstream.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/tdlib/telegram-bot-api
            org.opencontainers.image.revision=${{ steps.upstream.outputs.sha }}
          cache-from: type=gha,scope=telegram-bot-api

      - name: Smoke test official binary
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /usr/local/bin/telegram-bot-api telegram-bot-api:test --version
          docker run --rm --entrypoint /usr/local/bin/telegram-bot-api telegram-bot-api:test --help >/dev/null

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=upstream-${{ steps.upstream.outputs.sha }}
            type=sha
          labels: |
            org.opencontainers.image.source=https://github.com/tdlib/telegram-bot-api
            org.opencontainers.image.revision=${{ steps.upstream.outputs.sha }}
            org.opencontainers.image.description=Telegram official Bot API server built from source by shaoyou11

      - name: Publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TELEGRAM_BOT_API_REF=${{ steps.upstream.outputs.sha }}
          cache-from: type=gha,scope=telegram-bot-api
